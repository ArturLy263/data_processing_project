name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for the job-local database; not a secret.
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://retail:retail@localhost:5432/retail
      TEST_DATABASE_URL: postgresql://retail:retail@localhost:5432/retail
      REQUIRE_TEST_DATABASE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Pipeline runs end to end on a fresh checkout
        run: python -m src.main
      - name: Pipeline loads its results into PostgreSQL, twice
        run: |
          python -m src.main --load-postgres
          python -m src.main --load-postgres
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT region, COUNT(*) FROM sales_analysis GROUP BY region ORDER BY region"
          test "$(psql "$DATABASE_URL" -tAc 'SELECT COUNT(*) FROM sales_analysis')" = 5000
